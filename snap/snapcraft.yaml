name: pocind-messenger
title: POCIND MESSENGER
base: core24
adopt-info: fluffychat
license: AGPL-3.0
summary: Aplikasi komunitas POCIND Indonesia di jaringan Matrix
description: |
  ## POCIND MESSENGER

  Aplikasi komunikasi komunitas POCIND Indonesia yang terhubung ke homeserver
  Matrix matrix.pocindonesia.com.

  ### Chat dan grup

  Kirim pesan, foto, dokumen, pesan suara, dan lokasi. Buat grup untuk komunitas,
  kegiatan, dan koordinasi sehari-hari.

  ### Berbasis Matrix

  Menggunakan protokol terbuka Matrix, sehingga tetap dapat berkomunikasi dengan
  pengguna klien Matrix lain.

  ### Catatan penting

  Percakapan tidak dienkripsi end-to-end, sehingga isi pesan dapat dibaca oleh
  pengelola server untuk keperluan audit komunitas.

  ### Open source

  POCIND MESSENGER adalah perangkat lunak bebas berlisensi AGPL-3.0-or-later dan
  merupakan modifikasi dari FluffyChat. Kode sumber tersedia di
  https://github.com/POC-INDONESIA/messenger

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: amd64
  arm64:
    build-on: arm64

parts:
  flutter-git:
    source: .
    plugin: nil
    name: pocind-messenger
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      git clone --depth 1 --branch "$(jq -r .flutter .fvmrc)" https://github.com/flutter/flutter.git $CRAFT_PART_INSTALL/usr/libexec/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/flutter $CRAFT_PART_INSTALL/usr/bin/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/dart $SNAPCRAFT_PART_INSTALL/usr/bin/dart
      $CRAFT_PART_INSTALL/usr/bin/flutter doctor
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - git
      - jq
      - zip
      - lld
      - llvm-18
    override-prime: ''

  pocind-messenger:
    after: [flutter-git]
    plugin: nil
    source: .
    override-build: |
      craftctl set version="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"

      # Install rust manually:
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      export PATH="$HOME/.cargo/bin:$PATH"

      # Workaround for Flutter build error:
      rm -rf build

      flutter build linux --release -v
      mkdir -p $CRAFT_PART_INSTALL/bin/
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
    build-packages:
      - libsecret-1-dev
      - libjsoncpp-dev
      - libssl-dev
      - curl
      - libpciaccess-dev
      - libpulse-dev
    stage-packages:
      - libsecret-1-0
      - libjsoncpp25
      - libpciaccess0
      - libpulse0
      - libmpv2
      - libblas3
      - liblapack3
    override-prime: | # Workaround for MediaKit:
      craftctl default
      for library_dir in "$CRAFT_PRIME"/usr/lib/*-linux-gnu; do
        if [ -e "$library_dir/libmpv.so.2" ]; then
          ln -sf "$(basename "$library_dir")/libmpv.so.2" "$CRAFT_PRIME/usr/lib/libmpv.so.2"
        fi
        ln -sf blas/libblas.so.3 "$library_dir/libblas.so.3"
        ln -sf lapack/liblapack.so.3 "$library_dir/liblapack.so.3"
      done

slots:
  dbus-svc:
    interface: dbus
    bus: session
    name: com.pocindonesia.chat

apps:
  pocind-messenger:
    command: bin/pocind-messenger
    extensions: [ gnome ]
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-manager
      - opengl
      - removable-media
      - browser-support
      - password-manager-service
      - camera
      - audio-record
      - audio-playback
    slots:
      - dbus-svc
    environment:
      LIBMPV_LIBRARY_PATH: $SNAP/usr/lib/libmpv.so.2 # Otherwise app does not find libmp3
